<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriGraph AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#2D6A4F",
              "primary-container": "#D8F3DC",
              "deep-green": "#1B4332",
              "soft-green": "#95d4b3",
              "warning-yellow": "#F6C445",
              "risk-red": "#D64545",
              background: "#F5F5F5",
              surface: "#FFFFFF",
              border: "#D9E2EC",
              "text-primary": "#1F2933",
              "text-secondary": "#52606D",
              "bg-base": "#f8faf6",
              "dark-bg": "#0B1220",
              "dark-surface": "#111B2E",
              "dark-border": "#223047",
              "dark-text-primary": "#E5EEF7",
              "dark-text-secondary": "#9FB0C3",
              "dark-accent": "#5AB587",
            },
            fontFamily: {
              inter: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            fontSize: {
              "page-title": ["28px", { lineHeight: "36px", fontWeight: "600", letterSpacing: "-0.02em" }],
              "section-heading": ["18px", { lineHeight: "24px", fontWeight: "600" }],
              "card-title": ["14px", { lineHeight: "20px", fontWeight: "500", letterSpacing: "0.05em" }],
              "metric-value": ["36px", { lineHeight: "1", fontWeight: "700", letterSpacing: "-0.03em" }],
              "body-base": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "table-cell": ["13px", { lineHeight: "18px", fontWeight: "400" }],
              "label-caps": ["12px", { lineHeight: "16px", fontWeight: "600" }],
            },
            spacing: {
              "section-margin": "32px",
              "container-max-width": "1280px",
              gutter: "24px",
              "component-gap": "12px",
              "panel-padding": "20px",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
      input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 9999px; background: #2D6A4F; border: 2px solid #fff; box-shadow: 0 0 0 1px #2D6A4F; cursor: pointer; }
      input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 9999px; background: #D9E2EC; }
      input[type="range"]::-moz-range-track { height: 6px; border-radius: 9999px; background: #D9E2EC; border: none; }
      input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 9999px; background: #2D6A4F; border: 2px solid #fff; box-shadow: 0 0 0 1px #2D6A4F; cursor: pointer; }
    </style>
  </head>
  <body class="bg-background font-inter">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
